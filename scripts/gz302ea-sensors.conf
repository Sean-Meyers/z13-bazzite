# lm_sensors labels for GZ302EA
# Friendly names so KDE Plasma System Monitor widgets show
# distinguishable labels instead of duplicate "Temperature 1" entries.

chip "acpitz-acpi-0"
    label temp1 "CPU (ACPI 1)"
    label temp2 "CPU (ACPI 2)"
    label temp3 "Skin"

chip "mt7925_phy0-pci-*"
    label temp1 "WiFi/BT"

chip "asus-isa-0000"
    label fan1 "CPU Fan"
    label fan2 "GPU Fan"
