name: Build and push the image

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
  # Weekly rebuild (Sundays 06:00 UTC) so the image picks up Bazzite's own updates.
  schedule:
    - cron: '0 6 * * 0'
  workflow_dispatch:

env:
  IMAGE_NAME: z13-bazzite
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Maximize build space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo docker image prune --all --force
          df -h /

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: tags
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}"
          IMAGE=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          echo "latest_tag=${IMAGE}:latest" >> "$GITHUB_OUTPUT"
          echo "dated_tag=${IMAGE}:$(date +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        run: |
          sudo apt-get -y install buildah
          buildah build --pull -f Containerfile \
            -t ${{ steps.tags.outputs.latest_tag }} \
            -t ${{ steps.tags.outputs.dated_tag }} .
          buildah push ${{ steps.tags.outputs.latest_tag }}
          buildah push ${{ steps.tags.outputs.dated_tag }}
